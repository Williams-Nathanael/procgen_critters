<title>Critter Taste Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f3f1ea; --panel:#faf9f5; --ink:#1d1d1b; --muted:#625f57; --rule:#cfcabd; --accent:#8a3b12; --accent-ink:#ffffff; --focus:#1a5fb4;
  --fav:#245c2e; --rej:#8c1d1d; --fine:#3b3b38; --paper:#ffffff; --paper-ink:#111111;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191917; --panel:#222220; --ink:#e9e6dc; --muted:#a29e92; --rule:#403e38; --accent:#e0a070; --accent-ink:#191917; --focus:#7db3ff;
    --fav:#7fc58a; --rej:#e58a8a; --fine:#c9c5b8; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191917; --panel:#222220; --ink:#e9e6dc; --muted:#a29e92; --rule:#403e38; --accent:#e0a070; --accent-ink:#191917; --focus:#7db3ff;
  --fav:#7fc58a; --rej:#e58a8a; --fine:#c9c5b8; color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-right,0px)) 80px max(16px, env(safe-area-inset-left,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);padding:8px 0 6px;margin:0 0 16px}
.topline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
h1{font-size:1.15rem;margin:0;letter-spacing:.02em}
#progress{font-variant-numeric:tabular-nums}
#status{color:var(--muted);font-size:.85rem;margin-left:auto}
nav{display:flex;gap:4px 14px;overflow-x:auto;padding:6px 0 2px;white-space:nowrap}
nav a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule);padding:2px 0}
nav a:hover{border-bottom-color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,.scroll:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.intro{max-width:44rem;margin:0 0 20px}
section{margin:0 0 36px;scroll-margin-top:90px}
.row{scroll-margin-top:110px}
h2{font-size:1rem;text-transform:uppercase;letter-spacing:.1em;margin:0 0 4px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.sub{color:var(--muted);margin:4px 0 10px;font-size:.9rem}
.row{display:grid;grid-template-columns:11rem 360px minmax(0,1fr);gap:4px 14px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}
.row.mix{grid-template-columns:11rem 480px minmax(0,1fr)}
.name{font-weight:600;overflow-wrap:anywhere}
.name small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.scroll{overflow-x:auto;max-width:100%;background:var(--paper);border:1px solid var(--rule)}
.strip{height:calc(60px * var(--k,1));width:calc(var(--w) * var(--k,1) * 1px);background-repeat:no-repeat;background-size:calc(var(--w) * var(--k,1) * 1px) auto;background-position:0 calc(var(--i) * -60px * var(--k,1));background-color:var(--paper)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctl button,.copybtn{font:inherit;font-size:.85rem;background:transparent;color:var(--ink);border:1px solid var(--muted);border-radius:2px;padding:3px 9px;min-height:30px;cursor:pointer}
.ctl button.v::before{content:"\25CB\00a0"}
.ctl button.v[aria-pressed="true"]::before{content:"\25CF\00a0"}
.ctl button.v[aria-pressed="true"]{font-weight:700;border-width:2px;padding:2px 8px}
.ctl button.v[data-v="fav"][aria-pressed="true"],.ctl button.v[data-v="cut"][aria-pressed="true"]{}
.ctl button[data-v="fav"][aria-pressed="true"],.ctl button[data-v="fix"][aria-pressed="true"]{color:var(--fav);border-color:var(--fav);background:color-mix(in srgb,var(--fav) 12%,transparent)}
.ctl button[data-v="rej"][aria-pressed="true"],.ctl button[data-v="cut"][aria-pressed="true"]{color:var(--rej);border-color:var(--rej);background:color-mix(in srgb,var(--rej) 12%,transparent);text-decoration:line-through}
.ctl button[data-v="fine"][aria-pressed="true"]{color:var(--fine);border-color:var(--fine);background:color-mix(in srgb,var(--fine) 14%,transparent)}
.ctl button.note{border-style:dashed;font-size:.8rem}
.ctl button.note.has{border-style:solid}
.noterow{grid-column:1/-1;display:none}
.noterow.open{display:block}
input[type=text],textarea{font:inherit;width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--muted);border-radius:2px;padding:5px 7px}
textarea{min-height:64px;resize:vertical}
.tagnote{margin-top:12px}
.tagnote label,.overall label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:3px}
.item{border-top:1px solid var(--rule);padding:12px 0 14px}
.item h3{margin:0 0 2px;font-size:1rem}
.item .complaint{margin:0 0 8px;color:var(--muted)}
.item .strips{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:8px}
.item .strips .cap{font-size:.78rem;color:var(--muted);margin:0 0 2px}
.item .ctl{margin-bottom:6px}
.copybtn{border-color:var(--accent);color:var(--accent);font-weight:600}
#copy-fallback{display:none;margin-top:8px;min-height:160px;font:12px/1.4 ui-monospace,Menlo,monospace}
#copy-msg{margin-left:8px;color:var(--muted);font-size:.85rem}
.themebtn{font:inherit;font-size:.8rem;background:none;border:1px solid var(--rule);color:var(--muted);padding:1px 7px;border-radius:2px;cursor:pointer}
@media (max-width:900px){
  .row,.row.mix{grid-template-columns:minmax(0,1fr)}
  section{scroll-margin-top:110px}
}
</style>
<div class="wrap">
<header class="top">
  <div class="topline">
    <h1>Critter Taste Check</h1>
    <span id="progress">0 of 0 marked</span>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
  <nav id="nav" aria-label="Sections"></nav>
</header>
<p class="intro">These are the critters at print size, the size they will sit on a page. Mark what you like, what is fine and what should go. Every answer saves as you click, marking is optional, and nothing has to be finished in one sitting.</p>
<main id="main"></main>
<section id="sec-overall" class="overall">
  <h2>Overall</h2>
  <label for="c-overall">Anything else: general taste, themes to add or avoid, things the sections missed.</label>
  <textarea id="c-overall"></textarea>
  <p class="ctl" style="margin-top:10px"><button type="button" class="copybtn" id="copy-btn">Copy all answers as text</button><span id="copy-msg" role="status"></span></p>
  <textarea id="copy-fallback" readonly aria-label="All answers as text, select and copy"></textarea>
</section>
</div>
<script>
(function(){
var M = /*MANIFEST*/null;
var LS_KEY = 'critter-taste-v1';
var VERDICTS = { species: [['fav','Favourite'],['fine','Fine'],['rej','Reject']], open: [['cut','Cut'],['fix','Fix'],['fine','Fine as is']] };
var recs = {};       // id -> {kind, tag, name, verdict, comment, at}
var db = null, dbState = 'pending', coll = null;
var chains = {}, timers = {}, ui = {};
var $ = function(id){ return document.getElementById(id); };
function el(tag, attrs, kids){ var e = document.createElement(tag); for (var k in (attrs||{})) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } (kids||[]).forEach(function(c){ e.appendChild(c); }); return e; }

// ---------- local mirror
function lsLoad(){ try { var s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) || {} : {}; } catch (e) { return {}; } }
function lsSave(){ try { localStorage.setItem(LS_KEY, JSON.stringify(recs)); } catch (e) {} }

// ---------- status
var statusTimer = 0;
function setStatus(kind){
  var t = { saved: 'Saved', saving: 'Saving...', local: 'Saved in this browser only', fail: 'Could not save, use Copy all answers' }[kind] || '';
  $('status').textContent = t;
}
function baseStatus(){ return dbState === 'ready' ? 'saved' : (dbState === 'pending' ? 'local' : 'local'); }

// ---------- db writes: one chain per doc
function pushDb(id){
  if (!coll) return;
  var prev = chains[id] || Promise.resolve();
  setStatus('saving');
  chains[id] = prev.then(function(){
    var r = recs[id];
    var ref = coll.doc(id);
    return (r ? ref.set(r) : ref.delete());
  }).then(function(){ if (chains[id] === undefined) return; setStatus('saved'); }, function(){ setStatus('fail'); });
}
function commit(id){
  lsSave();
  if (coll) pushDb(id); else setStatus('local');
  refreshProgress();
}
function change(id, meta, patch){
  var r = recs[id] || { kind: meta.kind, tag: meta.tag, name: meta.name, verdict: '', comment: '', at: 0 };
  for (var k in patch) r[k] = patch[k];
  r.at = Date.now();
  if (!r.verdict && !r.comment) delete recs[id]; else recs[id] = r;
  commit(id);
}

// ---------- controls
function makeCtl(id, meta, set){
  var box = el('div', { class: 'ctl', role: 'group', 'aria-label': meta.name + ' verdict' });
  ui[id] = { btns: {}, noteBtn: null, input: null, row: null };
  set.forEach(function(v){
    var b = el('button', { type: 'button', class: 'v', id: 'v-' + id + '-' + v[0], 'data-v': v[0], 'aria-pressed': 'false', text: v[1] });
    b.addEventListener('click', function(){
      var cur = recs[id] ? recs[id].verdict : '';
      change(id, meta, { verdict: cur === v[0] ? '' : v[0] });
      paint(id);
    });
    ui[id].btns[v[0]] = b; box.appendChild(b);
  });
  return box;
}
function makeNote(id, meta, container, openByDefault){
  var nb = el('button', { type: 'button', class: 'note', id: 'n-' + id, 'aria-expanded': 'false', text: 'note' });
  var wrap = el('div', { class: 'noterow' });
  var inp = el('input', { type: 'text', id: 'c-' + id, placeholder: 'One line', 'aria-label': 'Note on ' + meta.name, maxlength: '400' });
  wrap.appendChild(inp);
  nb.addEventListener('click', function(){ var o = !wrap.classList.contains('open'); wrap.classList.toggle('open', o); nb.setAttribute('aria-expanded', o); if (o) inp.focus(); });
  inp.addEventListener('input', function(){ debounced(id, meta, inp.value); });
  inp.addEventListener('blur', function(){ flush(id); });
  ui[id].noteBtn = nb; ui[id].input = inp; ui[id].noteWrap = wrap;
  return { btn: nb, wrap: wrap };
}
function debounced(id, meta, text){
  clearTimeout(timers[id]); setStatus('saving');
  timers[id] = setTimeout(function(){ delete timers[id]; change(id, meta, { comment: text.trim() }); paint(id); }, 800);
  ui[id].pending = { meta: meta, text: text };
}
function flush(id){
  if (!timers[id]) return;
  clearTimeout(timers[id]); delete timers[id];
  var p = ui[id].pending; change(id, p.meta, { comment: p.text.trim() }); paint(id);
}
function paint(id){
  var u = ui[id]; if (!u) return;
  var r = recs[id], v = r ? r.verdict : '';
  for (var k in u.btns) u.btns[k].setAttribute('aria-pressed', String(k === v));
  var has = !!(r && r.comment), ae = document.activeElement;
  if (u.noteBtn) {
    u.noteBtn.classList.toggle('has', has);
    u.noteBtn.textContent = has ? 'note (1)' : 'note';
  }
  if (u.input && ae !== u.input) {
    u.input.value = has ? r.comment : '';
    if (has && u.noteWrap) { u.noteWrap.classList.add('open'); u.noteBtn.setAttribute('aria-expanded', 'true'); }
  }
  if (u.area && document.activeElement !== u.area) u.area.value = r ? r.comment : '';
}
function commentBox(id, meta, label){
  var wrap = el('div', { class: 'tagnote' });
  var lab = el('label', { for: 'c-' + id, text: label });
  var ta = el('textarea', { id: 'c-' + id });
  ui[id] = { btns: {}, area: ta };
  ta.addEventListener('input', function(){ debounced(id, meta, ta.value); });
  ta.addEventListener('blur', function(){ flush(id); });
  wrap.appendChild(lab); wrap.appendChild(ta);
  return wrap;
}
function strip(sprite, i, w, k){
  var s = el('div', { class: 'strip', role: 'img', style: 'background-image:url(sprites/' + sprite + '.png);--w:' + w + ';--i:' + i + (k ? ';--k:' + k : '') });
  var sc = el('div', { class: 'scroll', tabindex: '0' }, [s]);
  return { box: sc, strip: s };
}
function speciesRow(tag, sp, i){
  var id = 'species-' + tag + '-' + sp.id, meta = { kind: 'species', tag: tag, name: sp.name };
  var row = el('div', { class: 'row', id: 'row-' + id });
  var st = strip(tag, i, M.cell * M.nSp);
  st.strip.setAttribute('aria-label', sp.name + ', ' + M.nSp + ' seeds');
  row.appendChild(el('div', { class: 'name', text: sp.name }));
  row.appendChild(st.box);
  var ctl = makeCtl(id, meta, VERDICTS.species);
  var n = makeNote(id, meta);
  ctl.appendChild(n.btn); row.appendChild(ctl); row.appendChild(n.wrap);
  return row;
}
function mixRow(a, b, i){
  var id = 'mix-' + a + '-' + b, name = a + ' + ' + b, meta = { kind: 'mix', tag: a + '+' + b, name: name };
  var row = el('div', { class: 'row mix', id: 'row-' + id });
  var st = strip('mixes', i, M.cell * M.nMix);
  st.strip.setAttribute('aria-label', name + ', ' + M.nMix + ' seeds');
  row.appendChild(el('div', { class: 'name', text: name }));
  row.appendChild(st.box);
  var ctl = makeCtl(id, meta, VERDICTS.species);
  var n = makeNote(id, meta);
  ctl.appendChild(n.btn); row.appendChild(ctl); row.appendChild(n.wrap);
  return row;
}

// ---------- build
var main = $('main'), nav = $('nav');
function navLink(id, text){ nav.appendChild(el('a', { href: '#' + id, text: text })); }
(function build(){
  var open = el('section', { id: 'sec-open' });
  open.appendChild(el('h2', { text: 'Seven open questions' }));
  open.appendChild(el('p', { class: 'sub', text: 'These did not pass the last review. Each is shown at print size and at 2x. Cut removes it, Fix keeps it for another round, Fine as is accepts it.' }));
  M.open.forEach(function(o){
    var id = 'open-' + o.id, meta = { kind: 'open', tag: o.rows[0].tag, name: o.title };
    var it = el('div', { class: 'item', id: 'item-' + id });
    it.appendChild(el('h3', { text: o.title }));
    it.appendChild(el('p', { class: 'complaint', text: 'Review said: ' + o.complaint }));
    var strips = el('div', { class: 'strips' });
    o.rows.forEach(function(r){
      var w = M.cell * M.nSp;
      var a = el('div'); a.appendChild(el('p', { class: 'cap', text: r.name + ', print size' }));
      var s1 = strip(r.tag, r.i, w); s1.strip.setAttribute('aria-label', r.name + ' at print size'); a.appendChild(s1.box);
      var b = el('div'); b.appendChild(el('p', { class: 'cap', text: r.name + ', 2x' }));
      var s2 = strip(r.tag, r.i, w, 2); s2.strip.setAttribute('aria-label', r.name + ' at 2x'); b.appendChild(s2.box);
      strips.appendChild(a); strips.appendChild(b);
    });
    it.appendChild(strips);
    var ctl = makeCtl(id, meta, VERDICTS.open);
    it.appendChild(ctl);
    var inp = el('input', { type: 'text', id: 'c-' + id, placeholder: 'Comment (optional)', 'aria-label': 'Comment on ' + o.title, maxlength: '400' });
    ui[id].input = inp; ui[id].noteWrap = null;
    inp.addEventListener('input', function(){ debounced(id, meta, inp.value); });
    inp.addEventListener('blur', function(){ flush(id); });
    it.appendChild(inp);
    open.appendChild(it);
  });
  main.appendChild(open); navLink('sec-open', 'Open questions');

  M.tags.forEach(function(t){
    var sec = el('section', { id: 'sec-' + t.tag });
    sec.appendChild(el('h2', { text: t.tag }));
    sec.appendChild(el('p', { class: 'sub', text: t.species.length + ' species, ' + M.nSp + ' seeds each.' }));
    t.species.forEach(function(sp, i){ sec.appendChild(speciesRow(t.tag, sp, i)); });
    var tid = 'tagnote-' + t.tag;
    sec.appendChild(commentBox(tid, { kind: 'tagnote', tag: t.tag, name: t.tag }, 'Comment on the ' + t.tag + ' tag as a whole'));
    main.appendChild(sec); navLink('sec-' + t.tag, t.tag);
  });

  var mx = el('section', { id: 'sec-mixes' });
  mx.appendChild(el('h2', { text: 'Mixes' }));
  mx.appendChild(el('p', { class: 'sub', text: 'Every pair of tags, ' + M.nMix + ' seeds each. Parts of one tag are lent to the body of the other.' }));
  M.pairs.forEach(function(p, i){ mx.appendChild(mixRow(p[0], p[1], i)); });
  main.appendChild(mx); navLink('sec-mixes', 'mixes');
  navLink('sec-overall', 'overall');
  ui['overall'] = { btns: {}, area: $('c-overall') };
  var meta = { kind: 'overall', tag: '', name: 'overall' };
  $('c-overall').addEventListener('input', function(){ debounced('overall', meta, $('c-overall').value); });
  $('c-overall').addEventListener('blur', function(){ flush('overall'); });
})();

var total = 0;
M.tags.forEach(function(t){ total += t.species.length; }); total += M.pairs.length;
function refreshProgress(){
  var n = 0; for (var id in recs) if ((recs[id].kind === 'species' || recs[id].kind === 'mix') && recs[id].verdict) n++;
  $('progress').textContent = n + ' of ' + total + ' marked';
}
function paintAll(){ for (var id in ui) paint(id); refreshProgress(); }

// ---------- copy
function answersText(){
  var lines = ['Critter taste check answers'];
  var groups = [['open','Open questions'],['species','Species'],['mix','Mixes'],['tagnote','Tag comments'],['overall','Overall']];
  var lab = { fav:'FAVOURITE', fine:'fine', rej:'REJECT', cut:'CUT', fix:'FIX' };
  groups.forEach(function(g){
    var ids = Object.keys(recs).filter(function(i){ return recs[i].kind === g[0]; }).sort();
    if (!ids.length) return;
    lines.push('', g[1]);
    ids.forEach(function(i){ var r = recs[i]; var head = r.kind === 'species' ? r.tag + ' / ' + r.name : r.name; var v = r.verdict ? (g[0] === 'open' && r.verdict === 'fine' ? 'FINE AS IS' : lab[r.verdict]) : ''; lines.push('- ' + head + (v ? ': ' + v : '') + (r.comment ? (v ? ' | ' : ': ') + r.comment : '')); });
  });
  return lines.join('\n');
}
$('copy-btn').addEventListener('click', function(){
  var text = answersText(), msg = $('copy-msg'), fb = $('copy-fallback');
  function fallback(){ fb.value = text; fb.style.display = 'block'; fb.focus(); fb.select(); msg.textContent = 'Select and copy the text below.'; }
  try {
    if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('no clipboard');
    navigator.clipboard.writeText(text).then(function(){ msg.textContent = 'Copied.'; fb.style.display = 'none'; }, fallback);
  } catch (e) { fallback(); }
});

// ---------- load: local first, then db when it arrives
recs = lsLoad(); paintAll(); setStatus('local');
function adopt(remote){
  var ids = {}; Object.keys(remote).concat(Object.keys(recs)).forEach(function(i){ ids[i] = 1; });
  Object.keys(ids).forEach(function(i){
    var r = remote[i], l = recs[i];
    if (r && (!l || (r.at || 0) >= (l.at || 0))) recs[i] = r;
    else if (l && (!r || (l.at || 0) > (r.at || 0))) { pushDb(i); }
  });
  lsSave(); paintAll();
}
(function connect(){
  var done = false;
  function fail(){ if (done) return; done = true; dbState = 'none'; setStatus('local'); }
  var timer = setTimeout(fail, 10000);
  var p;
  try { p = window.claude && window.claude.use ? window.claude.use('db') : null; } catch (e) { p = null; }
  if (!p) { clearTimeout(timer); fail(); return; }
  p.then(function(d){
    clearTimeout(timer);
    if (done) return;
    if (!d) { fail(); return; }
    done = true; db = d; coll = d.collection('answers');
    return coll.get().then(function(snap){
      var remote = {};
      snap.docs.forEach(function(s){ if (s.exists) remote[s.id] = s.data(); });
      dbState = 'ready'; adopt(remote); setStatus('saved');
    }, function(){ coll = null; dbState = 'none'; setStatus('local'); });
  }, fail);
})();
})();
</script>
